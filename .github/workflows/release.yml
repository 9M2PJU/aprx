name: Build and Release

on:
  release:
    types: [created]
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux-distros:
    name: Build Linux (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            image: ubuntu:latest
            target_name: aprx-2.9.1-ubuntu-x86_64
          - distro: debian
            image: debian:latest
            target_name: aprx-2.9.1-debian-x86_64
          - distro: fedora
            image: fedora:latest
            target_name: aprx-2.9.1-fedora-x86_64
          - distro: archlinux
            image: archlinux:latest
            target_name: aprx-2.9.1-archlinux-x86_64
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies (Debian/Ubuntu)
        if: matrix.distro == 'ubuntu' || matrix.distro == 'debian'
        run: apt-get update && apt-get install -y build-essential libssl-dev git perl debhelper fakeroot dpkg-dev zip
        
      - name: Install dependencies (Fedora)
        if: matrix.distro == 'fedora'
        run: dnf install -y gcc make openssl-devel git perl rpm-build rpmdevtools zip
        
      - name: Install dependencies (Arch Linux)
        if: matrix.distro == 'archlinux'
        run: pacman -Syu --noconfirm base-devel git perl openssl sudo zip
        
      - name: Build and Package (Debian/Ubuntu)
        if: matrix.distro == 'ubuntu' || matrix.distro == 'debian'
        run: |
          ./configure
          make
          make make-deb
          mkdir -p pkg-output
          for deb in ../aprx_*.deb; do
            if [ -f "$deb" ]; then
              mv "$deb" "pkg-output/${{ matrix.target_name }}.deb"
            fi
          done
          mkdir -p /tmp/zipbuild
          cp aprx aprx.conf.in README.md LICENSE /tmp/zipbuild/
          (cd /tmp/zipbuild && zip -9 -r "${OLDPWD}/${{ matrix.target_name }}.zip" .)
          
      - name: Build and Package (Fedora)
        if: matrix.distro == 'fedora'
        run: |
          ./configure --prefix=/usr --sysconfdir=/etc --sbindir=/usr/sbin --mandir=/usr/share/man
          make
          make logrotate.aprx
          mkdir -p pkg-output
          mkdir -p /tmp/buildroot/{etc/sysconfig,etc/logrotate.d,var/log/aprx,usr/lib/systemd/system}
          make install DESTDIR=/tmp/buildroot
          install -m 644 logrotate.aprx /tmp/buildroot/etc/logrotate.d/aprx
          install -m 644 rpm/aprx.default /tmp/buildroot/etc/sysconfig/aprx
          install -m 644 rpm/aprx.service /tmp/buildroot/usr/lib/systemd/system/aprx.service
          sed -e 's/@VERSION@/2.9.1/g' rpm/aprx.spec.in > /tmp/aprx.spec
          rpmbuild -bb --buildroot /tmp/buildroot --define "_topdir /tmp/rpmbuild" --define "_rpmdir $(pwd)/pkg-output" /tmp/aprx.spec --noclean --nodeps --define "buildroot /tmp/buildroot" || true
          find $(pwd)/pkg-output /tmp/rpmbuild -type f -name "*.rpm" -exec mv {} "pkg-output/${{ matrix.target_name }}.rpm" \; || true
          mkdir -p /tmp/zipbuild
          cp aprx aprx.conf.in README.md LICENSE /tmp/zipbuild/
          (cd /tmp/zipbuild && zip -9 -r "${OLDPWD}/${{ matrix.target_name }}.zip" .)

      - name: Build and Package (Arch Linux)
        if: matrix.distro == 'archlinux'
        run: |
          ./configure --prefix=/usr --sysconfdir=/etc --sbindir=/usr/sbin --mandir=/usr/share/man
          make
          mkdir -p pkg-output
          useradd -m builduser || true
          mkdir -p /home/builduser/build
          cp -r . /home/builduser/build/
          cp archlinux/PKGBUILD /home/builduser/build/PKGBUILD
          chown -R builduser:builduser /home/builduser
          su builduser -c "cd /home/builduser/build && makepkg -e --nodeps --noconfirm"
          find /home/builduser/build -maxdepth 1 -name "*.pkg.tar.zst" -exec mv {} "pkg-output/${{ matrix.target_name }}.pkg.tar.zst" \; || true
          mkdir -p /tmp/zipbuild
          cp aprx aprx.conf.in README.md LICENSE /tmp/zipbuild/
          (cd /tmp/zipbuild && zip -9 -r "${OLDPWD}/${{ matrix.target_name }}.zip" .)
          
      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target_name }}-zip
          path: ${{ matrix.target_name }}.zip

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.distro }}-package
          path: pkg-output/*

  build-pi:
    name: Build Raspberry Pi (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armhf
            cpu: armv7
            target_name: aprx-2.9.1-raspberrypi-armhf
          - arch: arm64
            cpu: aarch64
            target_name: aprx-2.9.1-raspberrypi-arm64
    steps:
      - uses: actions/checkout@v4
      
      - name: Build in QEMU
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: ${{ matrix.cpu }}
          distro: ubuntu22.04
          run: |
            apt-get update -y
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential gcc libc6-dev libssl-dev git perl zip
            ./configure
            make
            mkdir -p /tmp/zipbuild
            cp aprx aprx.conf.in README.md LICENSE /tmp/zipbuild/
            (cd /tmp/zipbuild && zip -9 -r "${OLDPWD}/${{ matrix.target_name }}.zip" .)
            
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target_name }}
          path: ${{ matrix.target_name }}.zip

  build-macos:
    name: Build macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build
        run: |
          ./configure
          make
          mkdir -p /tmp/zipbuild
          cp aprx aprx.conf.in README.md LICENSE /tmp/zipbuild/
          (cd /tmp/zipbuild && zip -9 -r "${OLDPWD}/aprx-2.9.1-macos-arm64.zip" .)
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aprx-2.9.1-macos-arm64
          path: aprx-2.9.1-macos-arm64.zip

  build-freebsd:
    name: Build FreeBSD (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y gmake perl5 git zip
          run: |
            ./configure --prefix=/usr/local --sysconfdir=/usr/local/etc
            gmake
            mkdir -p pkg-output
            mkdir -p /tmp/aprx-install/usr/local/sbin
            mkdir -p /tmp/aprx-install/usr/local/share/man/man8
            mkdir -p /tmp/aprx-install/usr/local/etc
            gmake DESTDIR=/tmp/aprx-install install
            cat << EOF > /tmp/aprx-install/+MANIFEST
            name: "aprx"
            version: "2.9.1"
            origin: "comms/aprx"
            comment: "APRS Digipeater and iGate"
            desc: "Aprx is an APRS specific Digipeater and iGate."
            maintainer: "kennethfinnegan2007@gmail.com"
            www: "https://github.com/9M2PJU/aprx"
            prefix: "/usr/local"
            EOF
            pkg create -m /tmp/aprx-install -r /tmp/aprx-install -o pkg-output/
            for f in pkg-output/*.pkg; do
              [ -f "$f" ] && mv "$f" pkg-output/aprx-2.9.1-freebsd-x86_64.pkg
            done
            mkdir -p /tmp/zipbuild
            cp aprx aprx.conf.in README.md LICENSE /tmp/zipbuild/
            (cd /tmp/zipbuild && zip -9 -r "${OLDPWD}/aprx-2.9.1-freebsd-x86_64.zip" .)
            
      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aprx-2.9.1-freebsd-x86_64-zip
          path: aprx-2.9.1-freebsd-x86_64.zip

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-package
          path: pkg-output/*

  release:
    name: Upload to Release
    needs: [build-linux-distros, build-pi, build-macos, build-freebsd]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: ${{ github.ref == 'refs/heads/master' && 'v2.9.1' || github.ref_name }}
          name: ${{ github.ref == 'refs/heads/master' && 'Aprx v2.9.1' || github.ref_name }}
          prerelease: false
          make_latest: true
